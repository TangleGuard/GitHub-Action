name: "TangleGuard"
description: "Abstracts your codebase into an interactive dependency graph diagram for architectural analysis."
author: "Jan Arends"
inputs:
  upload_results:
    description: "To upload the scan result to TangleGuard Cloud for further analysis"
    required: false
    default: "false"
  repository:
    description: "Repository in format 'owner/project' (optional, will be extracted from Git if not provided)"
    required: false
  description:
    description: "Project description for TangleGuard Cloud"
    required: false
  language:
    description: "Programming language (rust|javascript)"
    required: true
  path:
    description: "Path to the workspace to analyze (defaults to current directory)"
    required: false
    default: "."
  ignore_paths:
    description: "Comma-separated list of directory names to ignore during scanning (e.g., 'examples,benchmarks')"
    required: false
  fail_on_findings:
    description: "Whether to fail the action if any findings are detected"
    required: false
    default: "true"
  detect_change:
    description: "Whether to run change detection between PR base and head (only works on pull_request events)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Validate input parameters
      shell: bash
      run: |
        echo "🔍 Validating input parameters..."

        # Description is required when uploading results
        if [[ "${{ inputs.upload_results }}" == "true" && -z "${{ inputs.description }}" ]]; then
          echo "❌ Error: description is required when upload_results is enabled."
          echo "   Please provide a project description for better identification on the website."
          exit 1
        fi

        echo "✅ Input validation passed"

    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Download TangleGuard CLI
      shell: bash
      run: |
        echo "Downloading TangleGuard CLI..."
        if ! curl -L -o tangleguard-cli https://tangleguard-builds.s3.eu-central-1.amazonaws.com/cli/latest/tangleguard-cli; then
          echo "❌ Failed to download TangleGuard CLI"
          exit 1
        fi

        echo "Making it executable..."
        chmod +x tangleguard-cli

        echo "Verifying download..."
        if [[ ! -x "./tangleguard-cli" ]]; then
          echo "❌ TangleGuard CLI is not executable"
          exit 1
        fi
        echo "✅ TangleGuard CLI downloaded"

    - name: Run TangleGuard one-time validation
      shell: bash
      if: ${{ inputs.detect_change == 'false' }}
      run: |
        echo "🔍 Running TangleGuard validation..."

        validate_cmd="./tangleguard-cli -l ${{ inputs.language }} -p ${{ inputs.path }}"

        # Add ignore paths if specified
        if [[ -n "${{ inputs.ignore_paths }}" ]]; then
          validate_cmd="$validate_cmd --ignore-paths ${{ inputs.ignore_paths }}"
        fi

        validate_cmd="$validate_cmd validate run --circles --pretty"

        # Add --ci flag if fail_on_findings is true
        if [[ "${{ inputs.fail_on_findings }}" == "true" ]]; then
          validate_cmd="$validate_cmd --ci"
        fi

        echo "Running: $validate_cmd"
        eval $validate_cmd
        exit_code=$?

        if [[ $exit_code -eq 0 ]]; then
          echo "✅ TangleGuard validation passed"
        else
          echo "❌ TangleGuard found architecture issues (exit code: $exit_code)"
          exit $exit_code
        fi

    - name: Run TangleGuard change detection
      id: change_detection
      shell: bash
      if: ${{ inputs.detect_change == 'true' }}
      run: |
        echo "🔍 Running TangleGuard change detection..."

        # Check if we're in a PR context
        if [[ -z "${{ github.event.pull_request.base.sha }}" ]]; then
          echo "⚠️  Warning: detect_change is enabled but this is not a pull_request event."
          echo "   Change detection requires base and head commits from a pull request."
          echo "   Falling back to regular validation on current commit..."

          validate_cmd="./tangleguard-cli -l ${{ inputs.language }} -p ${{ inputs.path }}"
          if [[ -n "${{ inputs.ignore_paths }}" ]]; then
            validate_cmd="$validate_cmd --ignore-paths ${{ inputs.ignore_paths }}"
          fi
          validate_cmd="$validate_cmd validate run --circles --pretty"
          if [[ "${{ inputs.fail_on_findings }}" == "true" ]]; then
            validate_cmd="$validate_cmd --ci"
          fi
          eval $validate_cmd
          exit $?
        fi

        BASE_SHA="${{ github.event.pull_request.base.sha }}"
        HEAD_SHA="${{ github.event.pull_request.head.sha }}"

        echo "📊 Analyzing changes between:"
        echo "   Base: $BASE_SHA"
        echo "   Head: $HEAD_SHA"
        echo ""

        # Build base command (with --quiet for clean JSON output)
        base_cmd="./tangleguard-cli -q -l ${{ inputs.language }} -p ${{ inputs.path }}"
        if [[ -n "${{ inputs.ignore_paths }}" ]]; then
          base_cmd="$base_cmd --ignore-paths ${{ inputs.ignore_paths }}"
        fi
        base_cmd="$base_cmd validate run --circles"

        # Run analysis on BASE commit
        echo "🔍 Analyzing BASE commit ($BASE_SHA)..."
        git fetch origin "$BASE_SHA" --depth=1
        git checkout "$BASE_SHA"

        $base_cmd > base.json 2> base.err || true
        base_exit_code=$?

        echo "Base analysis complete (exit code: $base_exit_code)"
        if [[ -s base.err ]]; then
          echo "⚠️  Base validation stderr:"
          cat base.err
        fi

        # Run analysis on HEAD commit
        echo "🔍 Analyzing HEAD commit ($HEAD_SHA)..."
        git checkout "$HEAD_SHA"

        $base_cmd > head.json 2> head.err || true
        head_exit_code=$?

        echo "Head analysis complete (exit code: $head_exit_code)"
        if [[ -s head.err ]]; then
          echo "⚠️  Head validation stderr:"
          cat head.err
        fi

        # Debug: Check if JSON files exist and are valid
        echo "🔍 Checking validation outputs..."
        if [[ ! -f base.json ]]; then
          echo "❌ Error: base.json not found"
          exit 1
        fi
        if [[ ! -f head.json ]]; then
          echo "❌ Error: head.json not found"
          exit 1
        fi

        echo "Debug: base.json size: $(wc -c < base.json) bytes"
        echo "Debug: head.json size: $(wc -c < head.json) bytes"

        # Run diff command to compare results (stderr to file for debugging)
        echo "🔍 Computing diff..."
        ./tangleguard-cli -q validate diff base.json head.json > diff.json 2> diff.err || true
        diff_exit_code=$?

        echo "Diff computation complete (exit code: $diff_exit_code)"

        # Debug: Show any errors
        if [[ -s diff.err ]]; then
          echo "⚠️  Diff command stderr:"
          cat diff.err
        fi

        # Debug: Check diff.json
        echo "Debug: diff.json size: $(wc -c < diff.json) bytes"
        echo "Debug: First 200 chars of diff.json:"
        head -c 200 diff.json
        echo ""

        # Save outputs for the next step
        echo "base_sha=$BASE_SHA" >> $GITHUB_OUTPUT
        echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
        echo "diff_exit_code=$diff_exit_code" >> $GITHUB_OUTPUT

        # Save diff JSON output
        {
          echo "diff_json<<EOF"
          cat diff.json
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Post PR comment with change detection results
      if: ${{ inputs.detect_change == 'true' && github.event.pull_request.number }}
      uses: actions/github-script@v7
      with:
        script: |
          const diffJson = `${{ steps.change_detection.outputs.diff_json }}`;
          const baseSha = '${{ steps.change_detection.outputs.base_sha }}';
          const headSha = '${{ steps.change_detection.outputs.head_sha }}';
          const diffExitCode = parseInt('${{ steps.change_detection.outputs.diff_exit_code }}');
          const failOnFindings = '${{ inputs.fail_on_findings }}' === 'true';

          let diff;
          try {
            diff = JSON.parse(diffJson);
          } catch (e) {
            console.error('Failed to parse diff JSON:', e);
            console.error('Raw diff output (first 500 chars):', diffJson.substring(0, 500));
            core.setFailed(`Failed to parse validation diff results: ${e.message}`);
            return;
          }

          // Validate diff structure
          if (!diff.summary || !diff.summary.status) {
            console.error('Invalid diff structure - missing summary or status');
            console.error('Diff object:', JSON.stringify(diff));
            core.setFailed('Validation diff output has invalid structure');
            return;
          }

          // Determine status from diff
          const status = diff.summary.status;
          let statusEmoji, statusTitle, statusDescription, shouldFail;

          switch (status) {
            case 'clean':
              statusEmoji = '✅';
              statusTitle = 'No Architecture Issues';
              statusDescription = 'No circular dependencies or architecture violations found.';
              shouldFail = false;
              break;
            case 'improved':
              statusEmoji = '🎉';
              statusTitle = 'Issues Resolved';
              statusDescription = 'Great job! This PR fixes existing architecture issues.';
              shouldFail = false;
              break;
            case 'worsened':
              statusEmoji = '❌';
              statusTitle = 'New Issues Introduced';
              statusDescription = '**This PR introduces new architecture violations!** Please review the details below and fix the issues before merging.';
              shouldFail = true;
              break;
            case 'unchanged':
              statusEmoji = '⚠️';
              statusTitle = 'Existing Issues Unchanged';
              statusDescription = 'Architecture issues exist in both the base and this PR. Your changes did not introduce new issues, but existing issues remain.';
              shouldFail = failOnFindings;
              break;
            case 'mixed':
              statusEmoji = '🔄';
              statusTitle = 'Mixed Changes';
              statusDescription = 'This PR both fixes some issues and introduces new ones.';
              shouldFail = true;
              break;
            default:
              statusEmoji = '❓';
              statusTitle = 'Unknown Status';
              statusDescription = 'Unable to determine validation status.';
              shouldFail = false;
          }

          // Build summary section
          let summaryItems = [];
          if (diff.summary.rule_violations_added_count > 0) {
            summaryItems.push(`• ➕ **${diff.summary.rule_violations_added_count}** new rule violation(s)`);
          }
          if (diff.summary.rule_violations_removed_count > 0) {
            summaryItems.push(`• ➖ **${diff.summary.rule_violations_removed_count}** rule violation(s) fixed`);
          }
          if (diff.summary.circles_added_count > 0) {
            summaryItems.push(`• ➕ **${diff.summary.circles_added_count}** new circular ${diff.summary.circles_added_count === 1 ? 'dependency' : 'dependencies'}`);
          }
          if (diff.summary.circles_removed_count > 0) {
            summaryItems.push(`• ➖ **${diff.summary.circles_removed_count}** circular ${diff.summary.circles_removed_count === 1 ? 'dependency' : 'dependencies'} fixed`);
          }

          const summarySection = summaryItems.length > 0
            ? `\n### 📊 Summary\n\n${summaryItems.join('\n')}\n`
            : '';

          // Build details section
          let detailsSections = [];

          // Helper function to format violation location
          const formatLocation = (loc) => {
            const parts = [];
            if (loc.package) parts.push(loc.package);
            if (loc.module) parts.push(`::${loc.module}`);
            if (loc.item) parts.push(`::${loc.item}`);
            if (parts.length === 0 && loc.file_path) {
              return loc.line ? `${loc.file_path}:${loc.line}` : loc.file_path;
            }
            return parts.length > 0 ? parts.join('') : '<unknown>';
          };

          if (diff.rule_violations_added.length > 0) {
            let violations = diff.rule_violations_added.map(v =>
              `  • ${formatLocation(v.from)} → ${formatLocation(v.to)}`
            ).join('\n');
            detailsSections.push(`**❌ New Rule Violations:**\n${violations}`);
          }

          if (diff.rule_violations_removed.length > 0) {
            let violations = diff.rule_violations_removed.map(v =>
              `  • ${formatLocation(v.from)} → ${formatLocation(v.to)}`
            ).join('\n');
            detailsSections.push(`**✅ Fixed Rule Violations:**\n${violations}`);
          }

          if (diff.circles_added.length > 0) {
            let circles = diff.circles_added.map(c => `  • ${c.cycle.join(' → ')}`).join('\n');
            detailsSections.push(`**❌ New Circular Dependencies:**\n${circles}`);
          }

          if (diff.circles_removed.length > 0) {
            let circles = diff.circles_removed.map(c => `  • ${c.cycle.join(' → ')}`).join('\n');
            detailsSections.push(`**✅ Fixed Circular Dependencies:**\n${circles}`);
          }

          const detailsSection = detailsSections.length > 0
            ? `\n<details>\n<summary>📋 Details</summary>\n\n${detailsSections.join('\n\n')}\n\n</details>\n`
            : '';

          const commentBody = `## ${statusEmoji} TangleGuard Architecture Analysis

          **${statusTitle}**

          ${statusDescription}
          ${summarySection}${detailsSection}
          ---
          <sub>🔍 Analyzed \`${baseSha.substring(0, 7)}\` → \`${headSha.substring(0, 7)}\` by [TangleGuard](https://tangleguard.com) | [Documentation](https://docs.tangleguard.com)</sub>`;

          // Post the comment
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: commentBody
          });

          console.log('✅ Comment posted successfully');

          // Set the action to fail if needed
          if (shouldFail) {
            core.setFailed('Architecture issues detected');
          }

    - name: Upload results to TangleGuard Cloud
      shell: bash
      if: ${{ inputs.upload_results == 'true' }}
      run: |
        echo "Scanning workspace and uploading results to TangleGuard Cloud..."

        # Scan and upload results
        upload_cmd="./tangleguard-cli --language ${{ inputs.language }}"

        # Add path if specified (default is current directory)
        if [[ -n "${{ inputs.path }}" ]]; then
          upload_cmd="$upload_cmd --path ${{ inputs.path }}"
        fi

        # Add ignore paths if specified
        if [[ -n "${{ inputs.ignore_paths }}" ]]; then
          upload_cmd="$upload_cmd --ignore-paths ${{ inputs.ignore_paths }}"
        fi

        # Add upload subcommand
        upload_cmd="$upload_cmd upload"

        # Add upload subcommand arguments
        if [[ -n "${{ inputs.description }}" ]]; then
          upload_cmd="$upload_cmd --description \"${{ inputs.description }}\""
        fi

        if [[ -n "${{ inputs.repository }}" ]]; then
          upload_cmd="$upload_cmd --repository \"${{ inputs.repository }}\""
        fi

        eval $upload_cmd

branding:
  icon: "layers"
  color: "gray-dark"
